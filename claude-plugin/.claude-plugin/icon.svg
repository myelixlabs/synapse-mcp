<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256">
  <!-- Dark background -->
  <rect width="64" height="64" rx="12" fill="#101114"/>

  <!-- Left Hemisphere Nodes -->
  <circle cx="20" cy="20" r="3" fill="#2ef2ff"/>
  <circle cx="12" cy="32" r="2.5" fill="#a45cff"/>
  <circle cx="24" cy="44" r="3" fill="#2ef2ff"/>
  <circle cx="28" cy="30" r="2" fill="#2ef2ff"/>

  <!-- Right Hemisphere Nodes -->
  <circle cx="44" cy="20" r="3" fill="#2ef2ff"/>
  <circle cx="52" cy="32" r="2.5" fill="#a45cff"/>
  <circle cx="40" cy="44" r="3" fill="#2ef2ff"/>
  <circle cx="36" cy="30" r="2" fill="#2ef2ff"/>

  <!-- Left Hemisphere Connections -->
  <path d="M20 20 L28 30 L12 32 Z" stroke="#2ef2ff" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.6" fill="none"/>
  <path d="M12 32 L24 44 L28 30 Z" stroke="#a45cff" stroke-width="1.5" opacity="0.5" fill="none"/>

  <!-- Right Hemisphere Connections -->
  <path d="M44 20 L36 30 L52 32 Z" stroke="#2ef2ff" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.6" fill="none"/>
  <path d="M52 32 L40 44 L36 30 Z" stroke="#a45cff" stroke-width="1.5" opacity="0.5" fill="none"/>

  <!-- Corpus Callosum (Bridge) -->
  <path d="M28 30 L36 30" stroke="#fff" stroke-width="2" opacity="0.8"/>
  <path d="M20 20 Q 32 10 44 20" stroke="#2ef2ff" stroke-width="1.5" opacity="0.4" fill="none"/>
  <path d="M24 44 Q 32 54 40 44" stroke="#a45cff" stroke-width="1.5" opacity="0.4" fill="none"/>
</svg>
